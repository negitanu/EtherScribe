#config-version=FGT60F-7.2.10-FW-build0000-000000:opmode=0:vdom=1:user=admin
config global
 config system global
  set hostname FG-BOUNDARY-LAB
 end
end
config vdom
 edit "Context A"
  config firewall address
   edit "Network A"
    set subnet 192.0.2.0 255.255.255.0
   next
  end
  config firewall policy
   edit 20
    set name first-rule
    set srcaddr "Network A"
    set action accept
    set logtraffic-start enable
   next
   edit 3
    set name second-rule
    set action deny
   next
   edit 100
    set name third-rule
    set action accept
   next
   edit 3
    set comments "更新しても順序を変えない"
   next
  end
end
config vdom
 edit "Context B"
  config system sdwan
   set status enable
  end
  config firewall address
   edit "Network B"
    set subnet 198.51.100.0 255.255.255.0
   next
  end
  config firewall service custom
   edit "Web B"
    set tcp-portrange 8443
   next
  end
  config firewall policy
   edit 7
    set name other-context-rule
    set action accept
   next
  end
  config router static
   edit 1
    set dst 203.0.113.0 255.255.255.0
    set gateway 198.51.100.254
   next
  end
end
