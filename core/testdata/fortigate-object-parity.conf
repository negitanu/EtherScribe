#config-version=FGT60F-7.2.10-FW-build0000-000000:opmode=0:vdom=1:user=admin
config system global
 set hostname FW-OBJECT-LAB
end
config vdom
 edit "営業 部"
  config firewall address
   edit "拠点 \"A\" LAN"
    set subnet 192.0.2.0 255.255.255.0
    set comment "営業 LAN の説明"
    set tag "業務 用"
    set tags "重要" "業務 用"
   next
   edit "Web Server"
    set type fqdn
    set fqdn www.example.com
   next
   edit "Client Range"
    set type iprange
    set start-ip 198.51.100.10
    set end-ip 198.51.100.20
   next
   edit "Dynamic Agent"
    set type dynamic
    set agent-id SYNTHETIC-AGENT
   next
   edit "拠点 \"A\" LAN"
    set comment "更新後の説明 <script>alert(1)</script>"
   next
  end
  config firewall address6
   edit "IPv6 LAN"
    set ip6 2001:db8:1::/64
   next
   edit "IPv6 Range"
    set type iprange
    set start-ip6 2001:db8:2::10
    set end-ip6 2001:db8:2::20
   next
  end
  config firewall addrgrp
   edit "業務 グループ"
    set member "拠点 \"A\" LAN" "Web Server"
    append member "Client Range"
    unselect member "Web Server"
    set comment "参照先の名前を保持"
   next
  end
  config firewall addrgrp6
   edit "IPv6 Group"
    set member "IPv6 LAN" "IPv6 Range"
   next
  end
  config firewall service custom
   edit "DNS Mixed"
    set tcp-portrange 53 8053-8054
    set udp-portrange 53
    set sctp-portrange 9000
    set comment "複数プロトコルの説明"
    set tags "DNS 用"
   next
   edit "Ping Request"
    set protocol ICMP
    set icmptype 8
    set icmpcode 0
   next
  end
  config firewall service group
   edit "業務 Service Group"
    set member "DNS Mixed" "Ping Request"
    set comment "サービスグループの説明"
   next
  end
 next
 edit "開発 部"
  config firewall address
   edit "拠点 \"A\" LAN"
    set subnet 203.0.113.0 255.255.255.0
    set comment "別 VDOM の同名定義"
   next
  end
 next
end
