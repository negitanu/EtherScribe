#config-version=FGT60F-7.2.10-FW-build0000-000000:opmode=0:vdom=0:user=admin
config system global
 set hostname FW-ESSENCE
end
config system interface
 edit port1
  set ip 192.0.2.1 255.255.255.0
  set allowaccess ping https ssh
 next
end
config firewall address
 edit LAN
  set subnet 10.0.0.0 255.255.255.0
 next
 edit WEB
  set type fqdn
  set fqdn www.example.com
 next
end
config firewall addrgrp
 edit LAN-GRP
  set member LAN
 next
end
config firewall service custom
 edit HTTP-ALT
  set tcp-portrange 8080
 next
end
config firewall vip
 edit VIP-WEB
  set extip 198.51.100.10
  set mappedip 10.0.0.10
  set extintf port1
  set portforward enable
  set extport 443
  set mappedport 443
 next
end
config firewall ippool
 edit POOL1
  set startip 198.51.100.20
  set endip 198.51.100.30
 next
end
config vpn ipsec phase1-interface
 edit TO-PEER
  set interface port1
  set remote-gw 203.0.113.1
  set proposal aes256-sha256
  set dhgrp 14
  set psksecret ENC hidden-psk-value
 next
end
config vpn ipsec phase2-interface
 edit TO-PEER-P2
  set phase1name TO-PEER
  set proposal aes256-sha256
  set src-subnet 10.0.0.0 255.255.255.0
  set dst-subnet 10.1.0.0 255.255.255.0
 next
end
config antivirus profile
 edit default
  set comment scan-web
  set scan-mode quick
  config http
   set options scan
  end
 next
end
config webfilter profile
 edit default
  config ftgd-wf
   config filters
    edit 1
     set category 26
    next
   end
  end
 next
end
config application list
 edit default
  config entries
   edit 1
    set category 23
    set application 900001 900002
    set action block
   next
  end
 next
end
config ips sensor
 edit default
  config entries
   edit 1
    set rule 1001
   next
  end
 next
end
config firewall ssl-ssh-profile
 edit deep-inspection
  config https
   set status deep-inspection
  end
 next
 edit certificate-inspection
 next
end
config system ha
 set mode a-p
 set group-id 10
 set group-name CLUSTER1
 set priority 200
 set hbdev port2 0 port3 1
 set monitor port1
 set password ENC ha-secret-value
 set ha-mgmt-status enable
 config ha-mgmt-interfaces
  edit 1
   set interface port4
   set dst 10.0.0.10 255.255.255.0
   set gateway 10.0.0.1
  next
 end
end
config log syslogd setting
 set status enable
 set server 192.0.2.50
 set port 514
end
config system snmp sysinfo
 set status enable
end
config system snmp community
 edit 1
  set name public-secret
  set trap-status enable
  config hosts
   edit 1
    set ip 192.0.2.100 255.255.255.255
   next
  end
 next
end
config log fortianalyzer setting
 set status enable
 set server 192.0.2.60
end
config vpn ssl settings
 set port 10443
 set source-interface port1
 set tunnel-ip-pools SSLVPN_TUNNEL
 config authentication-rule
  edit 1
   set groups SSL-Users
  next
 end
end
config vpn ssl web portal
 edit full-access
  set tunnel-mode enable
 next
end
config system dhcp server
 edit 1
  set interface port1
  set netmask 255.255.255.0
  set default-gateway 192.0.2.1
  set dns-server1 1.1.1.1
  set lease-time 7200
  config ip-range
   edit 1
    set start-ip 192.0.2.100
    set end-ip 192.0.2.200
   next
  end
 next
end
config router ospf
 set router-id 1.1.1.1
 config area
  edit 0.0.0.0
  next
 end
 config network
  edit 1
   set prefix 10.0.0.0 255.255.255.0
   set area 0.0.0.0
  next
 end
end
config router bgp
 set as 65001
 set router-id 1.1.1.1
 config neighbor
  edit 203.0.113.2
   set remote-as 65002
  next
 end
end
config router policy
 edit 1
  set input-device port1
  set output-device port1
  set src 10.0.0.0 255.255.255.0
  set dst 0.0.0.0 0.0.0.0
  set gateway 192.0.2.254
  set action permit
 next
end
config firewall policy
 edit 1
  set name allow-web
  set srcintf port1
  set dstintf port1
  set srcaddr LAN
  set dstaddr WEB
  set service HTTP-ALT
  set action accept
  set nat enable
  set av-profile default
 next
end
