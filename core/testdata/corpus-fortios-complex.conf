#config-version=FGT80F-7.4.5-FW-build0000:opmode=0:vdom=1
config system global
 set hostname "CORPUS-FG"
end
config system interface
 edit "lan-a"
  set vdom "Tenant A"
  set ip 192.0.2.1 255.255.255.0
 next
 edit "lan-b"
  set vdom "Tenant B"
  set ip 198.51.100.1 255.255.255.0
 next
 edit "wan1"
  set vdom "Tenant A"
  set ip 203.0.113.2 255.255.255.0
 next
 edit "wan2"
  set vdom "Tenant B"
  set ip 203.0.113.3 255.255.255.0
 next
end
config vdom
 edit "Tenant A"
 config firewall address
  edit "App Network"
   set subnet 192.0.2.0 255.255.255.0
   set comment "合成 & <境界>"
  next
  edit "App FQDN"
   set type fqdn
   set fqdn "app.example.test"
  next
 end
 config firewall addrgrp
  edit "App Group"
   set member "App Network" "App FQDN"
  next
 end
 config firewall service custom
  edit "App TLS"
   set tcp-portrange 443 8443
  next
 end
 config firewall vip
  edit "App VIP"
   set extintf "wan1"
   set extip 203.0.113.80
   set mappedip "192.0.2.80"
   set portforward enable
   set extport 443
   set mappedport 8443
  next
 end
 config router static
  edit 10
   set dst 0.0.0.0 0.0.0.0
   set gateway 203.0.113.1
   set device "wan1"
  next
 end
 config firewall policy
  edit 90
   set name "Rule 90"
   set srcintf "lan-a"
   set dstintf "wan1"
   set srcaddr "App Group"
   set dstaddr "all"
   set service "App TLS"
   set schedule "always"
   set action accept
   set logtraffic all
  next
  edit 4
   set name "Rule 4"
   set srcintf "lan-a"
   set dstintf "wan1"
   set srcaddr "App Group"
   set dstaddr "all"
   set service "App TLS"
   set schedule "always"
   set action deny
   set logtraffic all
  next
 end
 next
 edit "Tenant B"
 config firewall address
  edit "App Network"
   set subnet 198.51.100.0 255.255.255.0
   set comment "合成 & <境界>"
  next
  edit "App FQDN"
   set type fqdn
   set fqdn "app.example.test"
  next
 end
 config firewall addrgrp
  edit "App Group"
   set member "App Network" "App FQDN"
  next
 end
 config firewall service custom
  edit "App TLS"
   set tcp-portrange 443 8443
  next
 end
 config firewall vip
  edit "App VIP"
   set extintf "wan2"
   set extip 203.0.113.80
   set mappedip "198.51.100.80"
   set portforward enable
   set extport 443
   set mappedport 8443
  next
 end
 config router static
  edit 10
   set dst 0.0.0.0 0.0.0.0
   set gateway 203.0.113.1
   set device "wan2"
  next
 end
 config firewall policy
  edit 90
   set name "Rule 90"
   set srcintf "lan-b"
   set dstintf "wan2"
   set srcaddr "App Group"
   set dstaddr "all"
   set service "App TLS"
   set schedule "always"
   set action accept
   set logtraffic all
  next
  edit 4
   set name "Rule 4"
   set srcintf "lan-b"
   set dstintf "wan2"
   set srcaddr "App Group"
   set dstaddr "all"
   set service "App TLS"
   set schedule "always"
   set action deny
   set logtraffic all
  next
 end
 next
end
