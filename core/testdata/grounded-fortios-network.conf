#config-version=FGT80F-7.4.5-FW-build0000:opmode=0:vdom=0
config system global
 set hostname "GROUNDED-FG"
end
config system interface
 edit "port1"
  set ip 192.0.2.1 255.255.255.0
  set secondary-IP enable
  set vrf 10
  set mtu-override enable
  set mtu 9000
  config secondaryip
   edit 1
    set ip 198.51.100.1 255.255.255.0
   next
  end
  config ipv6
   set ip6-address 2001:db8:10::1/64
   config ip6-extra-addr
    edit 2001:db8:20::1/64
    next
   end
  end
 next
 edit "port2"
 next
 edit "port3"
 next
 edit "agg-static"
  set type aggregate
  set member "port2" "port3"
  set lacp-mode static
 next
end
config router static
 edit 10
  set gateway 192.0.2.254
  set device "port1"
  set vrf 10
  set distance 12
  set priority 50
  set comment "primary & backup"
 next
 edit 20
  set dst 203.0.113.0 255.255.255.0
  set blackhole enable
  set status disable
 next
end
config router static6
 edit 30
  set dst 2001:db8:30::/64
  set gateway 2001:db8:10::fe
  set device "port1"
  set distance 15
  set priority 25
 next
end
config firewall address
 edit "Branch"
  set subnet 198.51.100.0 255.255.255.0
  set allow-routing enable
 next
end
config router static
 edit 40
  set dstaddr "Branch"
  set gateway 192.0.2.254
 next
end
