# Model: EX4300-48T; independent synthetic compact brace configuration
system { host-name COMPACT-EX; }
/* Multiline comment containing { and ;
   must not affect hierarchy. */
interfaces {
 ge-0/0/0 { ether-options { 802.3ad ae0; } }
 ae0 { unit 0 { family ethernet-switching { interface-mode trunk; vlan { members [ BLUE GREEN ]; } } } }
}
routing-options {
 autonomous-system 64512;
 static { route 203.0.113.0/24 { next-hop [ 192.0.2.2 192.0.2.3 ]; preference 8; } }
 rib inet6.0 { static { route 2001:db8:30::/64 { next-hop 2001:db8::2; preference 9; } } }
}
protocols { bgp {
 group WAN { peer-as 64513; neighbor 203.0.113.2 { description "edge; {test} \"quoted\" # literal"; } }
 inactive: group OFF { peer-as 64514; neighbor 203.0.113.4; }
} }
