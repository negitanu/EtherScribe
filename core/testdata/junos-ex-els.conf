## Junos EX ELS synthetic fixture (brace)
version 21.4R3.15;
system {
    host-name SW-EX-LAB;
    time-zone Asia/Tokyo;
    name-server {
        1.1.1.1;
    }
    ntp {
        server 192.0.2.10;
    }
}
chassis {
    EX4300-48T;
}
interfaces {
    ge-0/0/0 {
        description uplink;
        ether-options {
            802.3ad ae0;
        }
    }
    ge-0/0/1 {
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members VLAN10;
                }
            }
        }
    }
    ge-0/0/2 {
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members [ VLAN10 VLAN20 ];
                }
            }
        }
    }
    ae0 {
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members VLAN10;
                }
            }
        }
    }
    irb {
        unit 10 {
            family inet {
                address 10.10.10.1/24;
            }
        }
        unit 20 {
            family inet {
                address 10.20.20.1/24;
            }
        }
    }
}
vlans {
    VLAN10 {
        vlan-id 10;
        l3-interface irb.10;
    }
    VLAN20 {
        vlan-id 20;
        l3-interface irb.20;
    }
}
protocols {
    rstp;
    bgp {
        local-as 65001;
        group EXT {
            neighbor 203.0.113.1 {
                peer-as 65002;
            }
        }
    }
}
routing-options {
    static {
        route 0.0.0.0/0 next-hop 10.10.10.254;
    }
}
routing-instances {
    VRF-A {
        instance-type virtual-router;
        interface irb.20;
        routing-options {
            static {
                route 192.0.2.0/24 next-hop 10.20.20.254;
            }
        }
    }
}
