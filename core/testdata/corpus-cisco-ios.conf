! Independent synthetic IOS future parser fixture
version 15.2
hostname CORPUS-IOS
vrf definition BLUE
 rd 64512:10
 address-family ipv4
 exit-address-family
!
interface Port-channel1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
!
interface GigabitEthernet0/1
 channel-group 1 mode active
!
interface Vlan10
 vrf forwarding BLUE
 ip address 192.0.2.1 255.255.255.0
!
ip access-list extended APP-IN
 permit tcp 198.51.100.0 0.0.0.255 host 192.0.2.80 eq 443
 deny ip any any log
!
router bgp 64512
 address-family ipv4 vrf BLUE
  neighbor 203.0.113.2 remote-as 64513
 exit-address-family
!
ip route vrf BLUE 0.0.0.0 0.0.0.0 192.0.2.254
end
